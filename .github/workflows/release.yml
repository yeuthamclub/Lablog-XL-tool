name: Bản cài đặt (Windows, macOS, Linux)

# Tạo bản phát hành: vào tab Actions > "Bản cài đặt" > Run workflow,
# hoặc gắn tag dạng v1.0.1 rồi đẩy lên. Số phiên bản lấy từ desktop/package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
          - os: macos-latest
            target: dist:mac
          - os: ubuntu-latest
            target: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dựng giao diện
        working-directory: .
        run: python3 scripts/build.py
      - run: npm install --no-audit --no-fund
      - name: Đóng gói
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.target }} -- --publish never 2>&1 | tee build.log || {
            # Đưa phần cuối nhật ký lỗi lên mục Annotations để dễ xem
            tail -n 40 build.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=build::$l"; done
            exit 1; }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: lablog-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*-mac-*.zip
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Đọc số phiên bản
        id: ver
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          name: LabLog Analyzer ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            Tải bản phù hợp với máy của bạn:
            - Windows 10/11: `LabLog-Analyzer-Setup-…-x64.exe`
            - macOS chip Apple (M1–M4): `LabLog-Analyzer-…-mac-arm64.dmg`
            - macOS chip Intel: `LabLog-Analyzer-…-mac-x64.dmg`
            - Linux: `LabLog-Analyzer-…-linux-x86_64.AppImage`

            Bản web (máy tính, iPad, iPhone): https://yeuthamclub.github.io/Lablog-XL-tool/

            Lần mở đầu: Windows bấm More info > Run anyway; macOS nhấp phải > Mở (hoặc System Settings > Privacy & Security > Open Anyway).
